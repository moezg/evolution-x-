[project]
name = "evolutionx"
version = "0.1.0"
description = "EVOLUTION X: self-evolving multi-agent market simulation laboratory (research-only)"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[project.scripts]
evox = "evolutionx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 600

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "S603", "S607", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
